[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysops-ops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml", "requests"]

[project.scripts]
ops = "ops:main"

[tool.hatch.build.targets.wheel]
only-include = ["ops.py"]

[tool.hatch.build.targets.sdist]
include = ["/ops.py", "/bin/ops", "/pyproject.toml", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".agents", ".commandcode", "runs", "vault", "incidents"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/scripts/test_9router_sync.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
exclude = "(\\.agents|runs|vault|incidents)"

