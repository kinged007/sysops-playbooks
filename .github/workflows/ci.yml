name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml requests ruff mypy types-PyYAML types-requests
      - name: Tests
        run: pytest -q
      - name: Lint (ruff)
        run: ruff check . bin/ops
      - name: Type check (mypy)
        run: mypy . bin/ops
      - name: Leak scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Leak scan (trufflehog)
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --results=verified,unverified,unknown
