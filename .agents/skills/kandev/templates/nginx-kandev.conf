# nginx-kandev.conf — Kandev reverse proxy vhost (isolated include)
# Placeholders: <DOMAIN>, <PORT> (e.g. 38429 or custom KANDEV_BACKEND_PORT), TLS cert paths
# Recommended host layout for clean removal (§11.2):
#   isolated:  /srv/kandev/nginx-kandev.conf  (this file) — one rm deletes it
#   main nginx.conf:  include /srv/kandev/nginx-kandev.conf;
#   or classic: /etc/nginx/sites-available/kandev.conf → sites-enabled/ symlink
#
# Kandev serves SPA + /api + /ws + /mcp + /health + /ready on one origin (port <PORT>).
# Proxy the ENTIRE root and preserve WebSocket upgrades — subpath deployments (/kandev/) are not supported.
#
# TLS: use certbot HTTP-01 (webroot) or DNS-01 (Cloudflare) to issue certs;
# or reuse an existing Dokploy/Traefik cert store.

# --- HTTP: ACME challenge + redirect to HTTPS (certbot may manage this) ---
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ {
        # certbot webroot if using HTTP-01; adjust root if needed
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# --- HTTPS: Kandev ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    # TLS (replace with your certbot/Dokploy paths)
    ssl_certificate /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/<DOMAIN>/chain.pem; # if using OCSP stapling

    # Security headers (tune to taste)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # add_header X-Frame-Options DENY always;
    # add_header X-Content-Type-Options nosniff always;

    # Kandev proxy — mirrors playbook §11.2, required for /ws and /mcp WebSocket upgrades
    location / {
        proxy_pass http://127.0.0.1:<PORT>;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;

        # Optional: larger body for worktree uploads / backups
        client_max_body_size 100m;

        # KANDEV_TRUSTED_PROXIES must list this nginx peer IP seen by Kandev (peer, not client net)
        # See playbook §9.2 / G9 — missing entry causes "ignoring X-Forwarded-Host from untrusted peer"
    }

    access_log /var/log/nginx/kandev-<DOMAIN>-access.log;
    error_log /var/log/nginx/kandev-<DOMAIN>-error.log;
}
