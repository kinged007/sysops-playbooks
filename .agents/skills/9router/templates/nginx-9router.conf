# Nginx reverse-proxy for 9Router — template
# Copy to /etc/nginx/sites-available/9router on <ALIAS>, fill <DOMAIN> and
# <PORT> (default 20128), then:
#   ln -s /etc/nginx/sites-available/9router /etc/nginx/sites-enabled/9router
#   nginx -t && systemctl reload nginx
# TLS: use certbot or the host's existing ACME (Dokploy/Caddy) — the
# playbook's §6 documents the choice. This template assumes TLS is present.
# If you terminate TLS at Cloudflare or Traefik instead, keep this as HTTP
# behind that terminator and set AUTH_COOKIE_SECURE accordingly in .env.

# --- HTTP → HTTPS redirect (remove if TLS is terminated elsewhere) ---
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # ACME challenge passthrough (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS vhost ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    # Or the host's managed cert path (Dokploy/Traefik store, etc.)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/9router.access.log;
    error_log  /var/log/nginx/9router.error.log;

    # Proxy to 9Router (all paths: /dashboard, /api, /v1, static)
    location / {
        proxy_pass http://127.0.0.1:<PORT>;
        proxy_http_version 1.1;

        # Preserve host + proto for BASE_URL / AUTH_COOKIE_SECURE
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE (OpenAI streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;

        # Timeouts for long LLM streams
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Optional: tighter limit on /v1 (LLM) vs dashboard, if needed
    # client_max_body_size 20m;
}

# Notes:
# - 9Router must be reachable at 127.0.0.1:<PORT> (HOSTNAME=0.0.0.0 or 127.0.0.1).
# - When this proxy is in front, set in .env:
#     BASE_URL=https://<DOMAIN>
#     AUTH_COOKIE_SECURE=true
#     REQUIRE_API_KEY=true
# - Keep the direct <PORT> firewalled (ufw deny <PORT>) so clients must go via 443.
# - Dokploy/Traefik alternative: add labels on the 9router service instead of Nginx;
#   the playbook's §6 records which proxy is active per variant.
