# Example ~/.aws/credentials — placeholders only.
# Prefer SSO (see aws-config.example.ini). Use this only for scoped IAM user
# keys, and never commit real values. Set file mode 0600.
# Real values belong in executions/aws-management[-<suffix>]/secrets/

[my-static-profile]
aws_access_key_id = <AWS_ACCESS_KEY_ID>
aws_secret_access_key = <AWS_SECRET_ACCESS_KEY>
# aws_session_token = <AWS_SESSION_TOKEN>  # only for temporary credentials
