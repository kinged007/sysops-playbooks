# Example ~/.aws/config — placeholders only. Copy relevant sections
# to ~/.aws/config and fill in real values from inventory.md.
# Real SSO URLs, account IDs, and role names never appear in committed files.

# --- SSO profile (preferred for human operators) ---
[profile my-sso-profile]
sso_start_url = https://<SSO_START_URL>
sso_region = <SSO_REGION>
sso_account_id = <AWS_ACCOUNT_ID>
sso_role_name = <SSO_ROLE_NAME>
region = <AWS_REGION>
output = json

# --- Static profile with default region ---
[profile my-static-profile]
region = <AWS_REGION>
output = json

# --- Assumed-role profile (cross-account / elevated) ---
[profile my-assumed-role]
role_arn = arn:aws:iam::<AWS_ACCOUNT_ID>:role/<ROLE_NAME>
source_profile = my-sso-profile
region = <AWS_REGION>
output = json

# --- Default profile (optional) ---
[default]
region = <AWS_REGION>
output = json
cli_pager =
