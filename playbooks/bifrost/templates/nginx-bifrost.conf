# Bifrost behind Nginx — streaming-safe (SSE/WebSocket), TLS expected.
# Copy to /etc/nginx/sites-available/bifrost, set <DOMAIN>, enable, add TLS, reload.
upstream bifrost {
  server 127.0.0.1:<PORT> fail_timeout=0;
}

server {
  listen 80;
  server_name <DOMAIN>;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name <DOMAIN>;

  # ssl_certificate / ssl_certificate_key managed by certbot/existing PKI
  # ssl_certificate /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

  # Streaming: never buffer proxied SSE/chunks
  proxy_buffering off;
  proxy_cache off;
  chunked_transfer_encoding on;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  send_timeout 300s;
  keepalive_timeout 75s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_pass http://bifrost;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
