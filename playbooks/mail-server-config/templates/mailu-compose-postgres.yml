# Mailu docker-compose — PostgreSQL backend, as deployed and verified 2026-09-28.
# Proven against Mailu 2024.06 on Docker 29 (swarm-mode host, plain compose project).
# Placeholder template: fill every <PLACEHOLDER> from plan.md, keep real secrets in
# the run's secrets/ folder. Never commit filled-in values.
#
#   docker compose -p <COMPOSE_PROJECT_NAME> up -d
#
# Rollback: docker compose -p <COMPOSE_PROJECT_NAME> down
#
# Image naming: Mailu publishes to ghcr.io/mailu with NO prefix component. A non-empty
# DOCKER_PREFIX produces ghcr.io/mailu/mailu-nginx, which does not exist (pull fails with
# "denied"). Leave DOCKER_PREFIX empty.
#
# The resolver (unbound) service is NOT optional. Rspamd uses it for DNSSEC validation and
# aborts at startup without it ("DNSSEC validation required but no resolver configured").
# It needs a fixed address so the mail services can point `dns:` at it.
#
# env_file note: Dokploy runs compose inside an isolated project directory and does not
# copy a host-referenced env_file, so under Dokploy the settings are passed with an
# `environment:` YAML anchor instead of env_file. Plain `docker compose` may use env_file.

x-mailu-env: &mailu-env
  <MAILU_ENV_KEYS>

services:
  redis:
    image: redis:alpine
    restart: always
    environment: *mailu-env
    volumes:
      - "<ROOT>/redis:/data"
    networks:
      - default
      - webmail

  resolver:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}unbound:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    networks:
      default:
        ipv4_address: <RESOLVER_IPV4>
        ipv6_address: <RESOLVER_IPV6>

  # front runs nginx (web: 80/443) plus dovecot in proxy mode for 25/465/587/993/4190.
  # The proxy listeners are driven by the PORT_* / TLS_* keys in mailu.env: if PORT_587
  # is absent, dovecot binds submission to port 0 and the published 587 is dead.
  # Drop the 80/443 publishers when a reverse proxy already owns those host ports.
  front:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}nginx:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "4190:4190"    # ManageSieve — used by Roundcube filters
    dns:
      - <RESOLVER_IPV4>
      - <RESOLVER_IPV6>
    depends_on:
      - resolver
    networks:
      - default
      - webmail
      - traefik
    volumes:
      - "<ROOT>/certs:/certs"
      - "<ROOT>/overrides/nginx:/overrides:ro"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment: *mailu-env
    networks:
      - default
    volumes:
      - "<ROOT>/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <DB_USER> -d <DB_NAME>"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}admin:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    dns:
      - <RESOLVER_IPV4>
      - <RESOLVER_IPV6>
    depends_on:
      - resolver
      - redis
      - postgres
    networks:
      - default
      - webmail
    volumes:
      - "<ROOT>/data:/data"
      - "<ROOT>/dkim:/dkim"      # per-domain DKIM keys live here, not in the DB

  imap:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}dovecot:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    dns:
      - <RESOLVER_IPV4>
      - <RESOLVER_IPV6>
    depends_on:
      - resolver
      - front
    networks:
      - default
    volumes:
      - "<ROOT>/mail:/mail"      # maildir storage, flat maildir:/mail/%u
      - "<ROOT>/overrides/dovecot:/overrides:ro"

  smtp:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}postfix:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    dns:
      - <RESOLVER_IPV4>
      - <RESOLVER_IPV6>
    depends_on:
      - resolver
      - front
    networks:
      - default
    volumes:
      - "<ROOT>/mailqueue:/queue"
      - "<ROOT>/overrides/postfix:/overrides:ro"

  antispam:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}rspamd:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    hostname: antispam      # rspamd's dkim_signing vault URL is hardcoded to this name
    dns:
      - <RESOLVER_IPV4>
      - <RESOLVER_IPV6>
    depends_on:
      - resolver
      - front
      - redis
    networks:
      - default
    volumes:
      - "<ROOT>/filter:/var/lib/rspamd"
      - "<ROOT>/overrides/rspamd:/overrides:ro"

  # Omit when WEBMAIL=none. Roundcube talks IMAP to front, not to imap directly.
  webmail:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}webmail:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    environment: *mailu-env
    dns:
      - <RESOLVER_IPV4>
      - <RESOLVER_IPV6>
    depends_on:
      - resolver
      - front
    networks:
      - webmail
    volumes:
      - "<ROOT>/webmail:/data"
      - "<ROOT>/overrides/roundcube:/overrides:ro"

networks:
  default:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: <SUBNET_V4>
        - subnet: <SUBNET_V6>
  webmail:
    driver: bridge
  # Remove this network (and the front entry) when no reverse proxy fronts the web UI.
  traefik:
    name: <EXTERNAL_PROXY_NETWORK>
    external: true
