# Mailu docker-compose — MEDIUM/LARGE scale (PostgreSQL backend).
# Same as mailu-compose.yml + a postgres service. For multi-domain /
# many-mailbox deployments (setup.md §0, discovery D2).
# Placeholder template: fill <PLACEHOLDER>s from plan.md, then
#   docker compose -p mailu up -d
# Requires in mailu.env: DB_FLAVOR=postgresql +
#   SQLALCHEMY_DATABASE_URI=postgresql://<DB_USER>:<DB_PASSWORD>@postgres/<DB_NAME>
# Rollback (fresh install): docker compose -p mailu down

services:
  front:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-nginx}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"      # POP3 — disable in mailu.env (POP3=false) if unused
      - "995:995"
      - "80:80"
      - "443:443"
      - "4190:4190"    # ManageSieve — used by Roundcube filters
    volumes:
      - "${ROOT:-<MAILU_DIR>}/certs:/certs:ro"
      - "${ROOT:-<MAILU_DIR>}/overrides:/overrides:ro"
    depends_on:
      - smtp
      - imap
    env_file: mailu.env

  resolver:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-unbound}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    env_file: mailu.env

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - mailu-redis:/data
    env_file: mailu.env

  postgres:
    image: postgres:<PG_VERSION>
    restart: always
    environment:
      - POSTGRES_USER=<DB_USER>
      - POSTGRES_PASSWORD=<DB_PASSWORD_REF>   # from run secrets/
      - POSTGRES_DB=<DB_NAME>
    volumes:
      - mailu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <DB_USER>"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: mailu.env

  smtp:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-postfix}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    volumes:
      - mailu-data:/mailu:Z
    depends_on:
      - resolver
      - redis
      - front
    env_file: mailu.env

  imap:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-dovecot}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    volumes:
      - mailu-data:/mailu:Z
    depends_on:
      - front
      - redis
    env_file: mailu.env

  antispam:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-rspamd}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    volumes:
      - mailu-data:/mailu:Z
    depends_on:
      - front
      - redis
      - smtp
      - imap
      - resolver
    env_file: mailu.env

  # Virus scanning (only when ANTIVIRUS=true in mailu.env)
  antivirus:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-clamav}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    volumes:
      - mailu-data:/mailu:Z
    depends_on:
      - antispam
    env_file: mailu.env

  # Webmail (only when WEBMAIL=roundcube in mailu.env)
  webmail:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-roundcube}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    volumes:
      - mailu-data:/mailu:Z
    depends_on:
      - front
      - imap
    env_file: mailu.env

  admin:
    image: ${DOCKER_ORG:-mailu}/${DOCKER_PREFIX:-admin}:${MAILU_VERSION:-<MAILU_VERSION>}
    restart: always
    volumes:
      - mailu-data:/mailu:Z
      - "${ROOT:-<MAILU_DIR>}/overrides:/overrides:ro"
    depends_on:
      - redis
      - postgres
    env_file: mailu.env

volumes:
  mailu-data:
    name: mailu-data   # maildir lives here — sizing decided in setup.md §0
  mailu-redis:
    name: mailu-redis
  mailu-postgres:
    name: mailu-postgres
